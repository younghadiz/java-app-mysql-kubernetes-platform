---
apiVersion: v1
kind: Service
metadata:
  name: java-app
  namespace: java-mysql
  labels:
    app.kubernetes.io/name: java-app
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: java-mysql-platform
spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: java-app

  ports:
    - name: http
      protocol: TCP
      appProtocol: http
      port: 8080
      targetPort: http