---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-app
  namespace: java-mysql
  labels:
    app.kubernetes.io/name: java-app
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: java-mysql-platform

spec:
  replicas: 2

  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: java-app

  template:
    metadata:
      labels:
        app.kubernetes.io/name: java-app
        app.kubernetes.io/component: application
        app.kubernetes.io/part-of: java-mysql-platform

    spec:
      imagePullSecrets:
        - name: dockerhub-registry

      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999  
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: java-app
          image: younghadiz/java-mysql-app:1.0.1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP 

          envFrom:
            - configMapRef:
                name: java-app-config

            - secretRef:
                name: java-app-secret

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 2

          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true

          volumeMounts:
            - name: temporary-storage
              mountPath: /tmp

      volumes:
        - name: temporary-storage
          emptyDir: {}