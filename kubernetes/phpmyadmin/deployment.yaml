---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpmyadmin
  namespace: java-mysql
  labels:
    app.kubernetes.io/name: phpmyadmin
    app.kubernetes.io/component: database-admin
    app.kubernetes.io/part-of: java-mysql-platform

spec:
  replicas: 1

  revisionHistoryLimit: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: phpmyadmin

  template:
    metadata:
      labels:
        app.kubernetes.io/name: phpmyadmin
        app.kubernetes.io/component: database-admin
        app.kubernetes.io/part-of: java-mysql-platform

    spec:
      automountServiceAccountToken: false

      terminationGracePeriodSeconds: 30

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: phpmyadmin
          image: phpmyadmin:5.2.2-apache
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          env:
            - name: PMA_HOST
              valueFrom:
                configMapKeyRef:
                  name: java-app-config
                  key: DB_SERVER

            - name: PMA_PORT
              value: "3306"

            - name: PMA_ARBITRARY
              value: "0"

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi

          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - NET_BIND_SERVICE
                - SETGID
                - SETUID