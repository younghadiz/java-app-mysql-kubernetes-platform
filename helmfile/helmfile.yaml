---
helmDefaults:
  wait: true
  timeout: 900
  createNamespace: true
  atomic: true
  cleanupOnFail: true
  historyMax: 5

repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami

releases:
  - name: mysql
    namespace: java-mysql
    chart: bitnami/mysql
    values:
      - environments/local/mysql-values.local.yaml

  - name: java-app
    namespace: java-mysql
    chart: ../../java-app-helm-chart
    needs:
      - java-mysql/mysql
    values:
      - environments/local/java-app-values.local.yaml